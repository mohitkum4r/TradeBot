[pytest]
minversion = 7.0
testpaths = tests
pythonpath = .
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Tests that take a long time to run

addopts = 
    --strict-markers
    --strict-config
    -ra
    --showlocals
    --tb=short

filterwarnings =
    ignore::DeprecationWarning
